name: signed-release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.4.2" }
      - name: Verify Crux Experts signed annotated tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gpg --batch --import .github/crux-experts-release-signing-key.asc
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          verification="$(git verify-tag --raw "$RELEASE_TAG" 2>&1)"
          printf '%s\n' "$verification"
          printf '%s\n' "$verification" | grep -F '[GNUPG:] VALIDSIG AF7968466B5B39C5E928FEFE716342D3EFBA5522 '
          bun run version:check "$RELEASE_TAG"
      - name: Install and validate exact release source
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          bun run check:upstreams
          bun run verify:contracts
          bun run typecheck
          bun test
          bun run verify:marketplace
          bun run verify:package
          bun run export:release
          (cd release && sha256sum -c SHA256SUMS.txt)
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(jq -r .version release/release-manifest.json)" = "${RELEASE_TAG#v}"
          test "$(jq -r .sourceRevision release/release-manifest.json)" = "$(git rev-parse HEAD)"
          gh release create "$RELEASE_TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "CruxOmni-OMP-Client ${RELEASE_TAG#v}" \
            --generate-notes \
            --verify-tag
